<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie-Talkie</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        #appScreen { padding: 20px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .channel-badge {
            background: #00d4ff;
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        .admin-badge {
            background: #ffd700;
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
        }
        .connection-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
        }
        .connection-status.connected { background: #00ff88; color: #000; }
        .connection-status.disconnected { background: #ff4444; color: #fff; }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .ptt-section {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
        }
        #pttButton {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 40px rgba(255,68,68,0.3);
        }
        #pttButton:hover { transform: scale(1.05); }
        #pttButton.active {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            box-shadow: 0 10px 40px rgba(0,255,136,0.3);
        }
        #pttButton:disabled {
            background: #444;
            cursor: not-allowed;
            box-shadow: none;
        }
        #pttStatus {
            margin-top: 20px;
            font-size: 1.2em;
            color: #888;
        }
        #pttStatus.transmitting { color: #00ff88; }
        #pttStatus.muted { color: #ff4444; }
        
        .visualizer {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 30px;
            height: 50px;
            align-items: flex-end;
        }
        .visualizer.active .bar { animation: bounce 0.5s ease infinite alternate; }
        .bar {
            width: 6px;
            background: #00d4ff;
            border-radius: 3px;
            height: 5px;
            transition: height 0.1s;
        }
        @keyframes bounce {
            from { height: 5px; }
            to { height: 40px; }
        }
        
        .users-section {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
        }
        .users-section h3 {
            margin-bottom: 15px;
            color: #00d4ff;
        }
        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.03);
            transition: all 0.3s;
        }
        .user-item.talking {
            background: rgba(0,212,255,0.1);
            border: 1px solid #00d4ff;
        }
        .user-item.muted { opacity: 0.5; }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
        }
        .admin-icon {
            position: absolute;
            bottom: -2px;
            right: -2px;
            font-size: 0.7em;
        }
        .user-info { flex: 1; }
        .user-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-label {
            font-size: 0.6em;
            background: #ffd700;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .user-status {
            font-size: 0.8em;
            color: #666;
        }
        .talking-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            transition: all 0.3s;
        }
        .user-item.talking .talking-indicator {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }
        .admin-actions {
            display: flex;
            gap: 5px;
        }
        .admin-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.75em;
            cursor: pointer;
        }
        .admin-btn.kick { background: #ff4444; color: #fff; }
        .admin-btn.mute { background: #ff8800; color: #fff; }
        .admin-btn.unmute { background: #00ff88; color: #000; }
        
        .chat-section {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            max-height: 200px;
        }
        .chat-message {
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
        }
        .chat-message.own {
            background: rgba(0,212,255,0.1);
            margin-left: 20%;
        }
        .msg-sender {
            font-size: 0.8em;
            color: #00d4ff;
            margin-bottom: 4px;
        }
        .msg-text { word-break: break-word; }
        .chat-input-group {
            display: flex;
            gap: 10px;
        }
        #chatInput {
            flex: 1;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            outline: none;
        }
        #chatInput:focus { border-color: #00d4ff; }
        #chatSendBtn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: #00d4ff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        
        .volume-control {
            margin-top: 20px;
            text-align: center;
        }
        #volumeSlider {
            width: 200px;
            accent-color: #00d4ff;
        }
        
        .kicked-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
        }
        .kicked-overlay.show { display: flex; }
        .kicked-overlay h2 { color: #ff4444; margin-bottom: 20px; }
        .kicked-overlay button {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            background: #00d4ff;
            color: #000;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="loginScreen" style="display:none"></div>
    <div id="appScreen">
        <div class="header">
            <div>
                <span class="channel-badge" id="channelBadge">general</span>
                <span class="admin-badge" id="adminBadge">ADMIN</span>
            </div>
            <div class="connection-status disconnected" id="connectionStatus">Disconnected</div>
        </div>
        
        <div class="main-grid">
            <div>
                <div class="ptt-section">
                    <button id="pttButton">PUSH TO TALK</button>
                    <div id="pttStatus">Hold button to talk</div>
                    <div class="visualizer" id="visualizer">
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div>
                    </div>
                </div>
                
                <div class="chat-section">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-group">
                        <input type="text" id="chatInput" placeholder="Type a message..." maxlength="200">
                        <button id="chatSendBtn">Send</button>
                    </div>
                </div>
            </div>
            
            <div>
                <div class="users-section">
                    <h3>👥 Users Online</h3>
                    <div id="usersContainer"></div>
                </div>
                
                <div class="volume-control">
                    <label>🔊 Volume</label><br>
                    <input type="range" id="volumeSlider" min="0" max="100" value="80">
                </div>
            </div>
        </div>
    </div>
    
    <div class="kicked-overlay" id="kickedOverlay">
        <h2>⛔ Kicked</h2>
        <p>You have been removed from the channel</p>
        <button onclick="location.reload()">Back to Login</button>
    </div>

    <script src="/app.js"></script>
</body>
</html>
